<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Speed Duel Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Speed Duel Calculator</h1>

    <!-- ヘルプボタン -->
    <button id="helpBtn" class="help-btn">❓使い方</button>

    <div class="units">
<div class="unit" id="unitA">
  <h2>Unit A</h2>
  <label>HP
    <input type="number" id="hpA"      placeholder="HP"                tabindex="1">
  </label>
  <label>攻撃
    <input type="number" id="atkA"     placeholder="Attack"            tabindex="2">
  </label>
  <label>魔攻
    <input type="number" id="matkA"    placeholder="Magic Attack"      tabindex="3">
  </label>
  <label>防御
    <input type="number" id="defA"     placeholder="Defense"           tabindex="4">
  </label>
  <label>魔防
    <input type="number" id="mdefA"    placeholder="Magic Defense"     tabindex="5">
  </label>
  <label>攻撃バフ率
    <input type="number" id="buffAtkA" placeholder="%"                 tabindex="6">
  </label>
  <label>魔攻バフ率
    <input type="number" id="buffMatkA"placeholder="%"                 tabindex="7">
  </label>
  <label>防御バフ率
    <input type="number" id="buffDefA" placeholder="%"                 tabindex="8">
  </label>
  <label>魔防バフ率
    <input type="number" id="buffMdefA"placeholder="%"                 tabindex="9">
  </label>
</div>

<div class="unit" id="unitB">
  <h2>Unit B</h2>
  <label>HP
    <input type="number" id="hpB"      placeholder="HP"                tabindex="10">
  </label>
  <label>攻撃
    <input type="number" id="atkB"     placeholder="Attack"            tabindex="11">
  </label>
  <label>魔攻
    <input type="number" id="matkB"    placeholder="Magic Attack"      tabindex="12">
  </label>
  <label>防御
    <input type="number" id="defB"     placeholder="Defense"           tabindex="13">
  </label>
  <label>魔防
    <input type="number" id="mdefB"    placeholder="Magic Defense"     tabindex="14">
  </label>
  <label>攻撃バフ率
    <input type="number" id="buffAtkB" placeholder="%"                 tabindex="15">
  </label>
  <label>魔攻バフ率
    <input type="number" id="buffMatkB"placeholder="%"                 tabindex="16">
  </label>
  <label>防御バフ率
    <input type="number" id="buffDefB" placeholder="%"                 tabindex="17">
  </label>
  <label>魔防バフ率
    <input type="number" id="buffMdefB"placeholder="%"                 tabindex="18">
  </label>
</div>

<button id="calcBtn" tabindex="19">計算する</button>
    <div id="result"></div>
  </div>

  <!-- ヘルプモーダル -->
  <div id="helpModal" class="modal">
    <div class="modal-content">
      <span id="closeHelp" class="close-btn">&times;</span>
      <h2>使い方＆計算式</h2>
      <div class="tabs">
        <button data-tab="howto" class="active">操作方法</button>
        <button data-tab="formula">計算式</button>
        <button data-tab="example">例題</button>
      </div>
      <div id="howto" class="tab-panel active">
        <ol>
          <li>各入力欄に数値を入力</li>
          <li>「計算する」ボタンを押下</li>
          <li>結果が下部に表示</li>
        </ol>
      </div>
      <div id="formula" class="tab-panel">
        <p>
          <code>行動値 = ⌊HP÷3⌋ + ⌊攻撃×(1＋バフ率÷100)⌋ + …</code>
        </p>
      </div>
      <div id="example" class="tab-panel">
        <p>入力例（図解）：</p>
        <img src="assets/images/diagram-example.png" alt="入力例の図解">
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
